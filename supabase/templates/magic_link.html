<!-- Sign-in code email (D114). {{ .Token }} is the code a teacher or administrator types into the
     sign-in page after choosing "Email me a sign-in code". There is no link on purpose: a link
     means leaving the page, and it only works if the app's address is on the project's redirect
     list. In the hosted project, paste this into Authentication > Emails > Templates > Magic Link,
     and set the subject to "Your CoNote code: {{ .Token }}". The code's length is the project's
     "Email OTP Length" setting (6 to 10 digits; the apps expect 6, see SIGN_IN_CODE_LENGTH). -->
<h2>Your CoNote sign-in code</h2>
<p>Type this code on the sign-in page to get in:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px; font-family: monospace">
  {{ .Token }}
</p>
<p>
  The code works once and expires soon. If you did not ask for it, ignore this email and nothing
  happens.
</p>
