# Continuous integration: checks every pull request and every push to main.
# A change can merge only when both jobs pass (docs/MILESTONES.md, "Continuous integration").
name: CI

on:
  # Every pull request, whatever its branch.
  pull_request:
  # Every push to main, so main itself is always verified.
  push:
    branches: [main]

# SECURITY: the workflow's GitHub token can only read the repository. A compromised step
# cannot push code, change settings or approve pull requests.
permissions:
  contents: read

# A new push to the same branch cancels the run still in progress, saving time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    # A fresh Linux machine for every run.
    runs-on: ubuntu-latest
    # Stop a stuck run after 20 minutes.
    timeout-minutes: 20
    env:
      # Build and test against demo data.
      VITE_DATA_SOURCE: mock
    steps:
      # Get the code. SECURITY: every action is pinned to an exact commit, so a hijacked tag
      # upstream can't swap in malicious code (supply-chain attack). The comment says the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so SonarCloud can tell which lines are new in a pull request.
          fetch-depth: 0

      # Install the Node version from .nvmrc, with npm's download cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # SECURITY: `npm ci` installs exactly what package-lock.json lists and fails if the lock
      # file is out of date, so no unexpected package versions sneak in.
      - name: Install
        run: npm ci

      # ESLint, including the security and import-boundary rules.
      - name: Lint
        run: npm run lint

      # Prettier formatting.
      - name: Format
        run: npm run format:check

      # TypeScript, strict mode.
      - name: Type check
        run: npm run typecheck

      # Vitest once (not watch mode), failing below the 80% coverage floor.
      - name: Unit and component tests with coverage
        run: npm test -- --run --coverage

      # Whether the SonarCloud token is set up. Pull requests from forks never receive secrets,
      # and the token is added by the repository owner, so the scan is skipped until it exists.
      # Only "true" or "false" is written out; the token itself never leaves the secrets store.
      - name: Check for SonarCloud token
        id: sonar
        run: echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # Code quality and the coverage report above, sent to SonarCloud (sonar-project.properties).
      - name: SonarCloud scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          # SECURITY: the token only lets CI upload analysis results. It is passed to this one
          # step, not the whole job, so no npm script or other tool can read it.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Production build.
      - name: Build
        run: npm run build

      # Fails if the first-load JavaScript exceeds 250 KB gzipped.
      - name: Bundle budget
        run: npm run size

      # Chromium plus the system libraries it needs, for the browser tests.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Browser tests against the production build with production security headers.
      - name: End-to-end tests
        run: npm run e2e

      # When a browser test fails, keep its report and traces for a week for debugging.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          # Each app writes its report in its own folder (D64).
          path: apps/*/playwright-report
          retention-days: 7

      # SECURITY: fails on any known high or critical vulnerability in a dependency.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history (fetch-depth: 0), so secrets in earlier commits are found too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # SECURITY: gitleaks fails the check if a password, API key or token was committed.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Lets gitleaks read the pull request it is scanning.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The database's own security checks: the migrations are applied to a throwaway Postgres and the
  # Row Level Security tests run against it (supabase/tests, admin REQUIREMENTS section 25).
  database:
    name: Database security tests
    # A fresh Linux machine for every run.
    runs-on: ubuntu-latest
    # Stop a stuck run after 10 minutes.
    timeout-minutes: 10
    services:
      # A throwaway Postgres, thrown away with the machine. The password is a placeholder for this
      # container only; it holds no real data and is not reachable from outside the runner.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Wait until the server accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Get the migrations and tests. SECURITY: pinned to an exact commit, like the other jobs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Apply the migrations and run every supabase/tests/*.test.sql file.
      - name: Database security tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash supabase/tests/run.sh

  # The Supabase services are tested against a real local Supabase stack (Auth, the API and a
  # database built from the migrations), using the same contract suites the demo services pass.
  supabase:
    name: Supabase contract tests
    # A fresh Linux machine for every run; it has Docker, which the local stack needs.
    runs-on: ubuntu-latest
    # Starting the stack takes a few minutes the first time.
    timeout-minutes: 20
    steps:
      # Get the code. SECURITY: pinned to an exact commit, like the other jobs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the Node version from .nvmrc, with npm's download cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # SECURITY: `npm ci` installs exactly what package-lock.json lists.
      - name: Install
        run: npm ci

      # Starts Auth, the API, the mail catcher and the database, builds the database from the
      # migrations and loads supabase/seed.sql. The version is pinned so a new CLI release cannot
      # change the result. Services the tests do not use are left out to save time.
      - name: Start local Supabase
        run: npx --yes supabase@2.120.0 start -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor

      # Reads the local project's address and keys. These belong to the throwaway stack on this
      # machine and die with it; they are not secrets. (The server key lets the tests reset data;
      # it is never used against a real project.)
      - name: Read local project settings
        run: |
          npx --yes supabase@2.120.0 status -o env > local.env
          {
            echo "VITE_SUPABASE_TEST_URL=$(grep '^API_URL=' local.env | cut -d= -f2- | tr -d '"')"
            echo "VITE_SUPABASE_TEST_ANON_KEY=$(grep '^ANON_KEY=' local.env | cut -d= -f2- | tr -d '"')"
            echo "VITE_SUPABASE_TEST_EMAIL=student@conote.example"
            echo "VITE_SUPABASE_TEST_SUSPENDED_EMAIL=suspended@conote.example"
            echo "VITE_SUPABASE_TEST_PASSWORD=password1"
            echo "VITE_SUPABASE_TEST_ADMIN_EMAIL=admin@conote.example"
            echo "VITE_SUPABASE_TEST_OTHER_EMAIL=ada@conote.example"
            echo "VITE_SUPABASE_TEST_SERVICE_KEY=$(grep '^SERVICE_ROLE_KEY=' local.env | cut -d= -f2- | tr -d '"')"
          } >> "$GITHUB_ENV"

      # Runs the shared contracts and the checks only a real backend can answer.
      - name: Run Supabase contract tests
        run: npx vitest run --project student --project portal apps/student/src/services/supabase packages/portal/src/supabase

      # The admin console's contracts come last: loading each contract's small platform first
      # empties the stack's accounts and courses, which the suites above rely on.
      - name: Run admin Supabase contract tests
        run: npx vitest run --project admin apps/admin/src/services/supabase
