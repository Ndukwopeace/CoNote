# Dependabot opens pull requests to update dependencies. SECURITY: known vulnerabilities get
# fixed promptly, and every update still has to pass CI before it merges.
version: 2
updates:
  # npm packages from package.json.
  - package-ecosystem: npm
    # package.json is at the repository root.
    directory: /
    # Check once a week.
    schedule:
      interval: weekly
    # At most 10 open update PRs at a time.
    open-pull-requests-limit: 10
    # Minor and patch updates arrive together in one PR; major updates stay separate for review.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions the project can't take yet (decision D24). Each package still gets its
    # minor and patch updates, including security fixes. Remove an entry once its blocker clears.
    ignore:
      # ESLint 10: eslint-plugin-jsx-a11y does not support it yet (decision D20).
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # @eslint/js 10 requires ESLint 10, so it has the same blocker.
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # TypeScript 7: typescript-eslint supports TypeScript below 6.1 only.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node's type definitions must match the Node version in .nvmrc (22); upgrade both together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # The GitHub Actions used by the workflows (updates their pinned commits).
  - package-ecosystem: github-actions
    directory: /
    # Check once a week.
    schedule:
      interval: weekly
    # All action updates in one PR.
    groups:
      actions:
        patterns: ['*']
