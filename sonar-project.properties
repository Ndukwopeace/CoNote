# SonarCloud settings for the analysis that runs in CI (.github/workflows/ci.yml).
# CI-based analysis replaces SonarCloud's "Automatic Analysis", which can't read coverage.

# The project and organisation on sonarcloud.io, as shown under Administration → Information.
sonar.projectKey=Ndukwopeace_CoNote
sonar.organization=ndukwopeace

# Application code lives in each app's src/ folder and in the shared packages (D64).
sonar.sources=apps,packages
# Unit tests sit next to the code; browser tests live in each app's e2e/ folder.
sonar.tests=apps
# Which files are tests rather than application code.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,apps/*/e2e/**
# Tests, test helpers, browser tests, build tooling and installed packages are not application code.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,apps/*/src/test/**,apps/*/e2e/**,apps/*/scripts/**,**/node_modules/**,**/dist/**

# The lcov report Vitest writes at the root with `npm test -- --run --coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is measured on the logic folders only (ENGINEERING_STANDARDS.md 2.6, vitest.config.ts).
# Pages, layouts and components are covered by page tests, axe and Playwright instead, so they are
# left out here too; otherwise SonarCloud would count them as 0% covered.
# packages/ui and packages/domain hold design primitives and type definitions, so they are left
# out too; packages/core is logic and is measured.
sonar.coverage.exclusions=apps/*/src/app/**,apps/*/src/pages/**,apps/*/src/layouts/**,apps/*/src/components/**,apps/*/src/main.tsx,apps/*/src/types/**,apps/*/*.config.ts,packages/ui/**,packages/domain/**,**/types.ts,**/*.contract.ts,**/seed/**
