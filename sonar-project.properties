# SonarCloud settings for the analysis that runs in CI (.github/workflows/ci.yml).
# CI-based analysis replaces SonarCloud's "Automatic Analysis", which can't read coverage.

# The project and organisation on sonarcloud.io, as shown under Administration → Information.
sonar.projectKey=Ndukwopeace_CoNote
sonar.organization=ndukwopeace

# Application code lives in src/.
sonar.sources=src
# Unit tests sit next to the code; browser tests live in e2e/.
sonar.tests=src,e2e
# Which files under src/ are tests rather than application code.
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,e2e/**
# Test helpers and fakes are not application code either.
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# The lcov report Vitest writes with `npm test -- --run --coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is measured on the logic folders only (ENGINEERING_STANDARDS.md 2.6, vitest.config.ts).
# Pages, layouts and components are covered by page tests, axe and Playwright instead, so they are
# left out here too; otherwise SonarCloud would count them as 0% covered.
sonar.coverage.exclusions=src/app/**,src/pages/**,src/layouts/**,src/components/**,src/main.tsx,src/types/**,**/types.ts,**/*.contract.ts,**/seed/**
