<!doctype html>
<!-- The single HTML page. Vite injects the built scripts; React renders everything into #root. -->
<!-- lang="en" tells screen readers and translators the page language. -->
<html lang="en">
  <head>
    <!-- Text encoding, so every character displays correctly. -->
    <meta charset="UTF-8" />
    <!-- Browser tab icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Use the device's real width on phones instead of a zoomed-out desktop view.
         viewport-fit=cover lets iOS report the notch and home-indicator sizes to CSS
         (env(safe-area-inset-*)), so the tab bar and headers can keep clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Summary shown by search engines and link previews. -->
    <meta name="description" content="CoNote: your notes, collective understanding." />
    <!-- Colours the mobile browser's address bar in the brand colour. -->
    <meta name="theme-color" content="#4F46E5" />
    <!-- Marks the page as a home-screen web app for iPhone. iOS uses the launch images below only
         for such apps; without them it showed a black screen at launch (D62). The second tag is
         the same declaration under the name other browsers read. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Home-screen icon for iPhone and iPad, which ignore the manifest's icons (FR-PWA-1).
         The manifest link itself is added by the PWA plugin at build time. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!-- iPhone launch images (D61): what iOS shows while the installed app starts, instead of a
         white screen. iOS picks the one whose size matches the device exactly, so there is one
         per screen size, portrait. Drawn by scripts/generate-icons.mjs. -->
    <!-- iPhone SE (2nd and 3rd generation), 8. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/iphone-750x1334.png"
    />
    <!-- iPhone X, XS, 11 Pro, 12 mini, 13 mini. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-1125x2436.png"
    />
    <!-- iPhone XR, 11. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/iphone-828x1792.png"
    />
    <!-- iPhone XS Max, 11 Pro Max. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-1242x2688.png"
    />
    <!-- iPhone 12, 12 Pro, 13, 13 Pro, 14. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-1170x2532.png"
    />
    <!-- iPhone 12 Pro Max, 13 Pro Max, 14 Plus. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-1284x2778.png"
    />
    <!-- iPhone 14 Pro, 15, 15 Pro, 16. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-1179x2556.png"
    />
    <!-- iPhone 14 Pro Max, 15 Plus, 15 Pro Max, 16 Plus. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-1290x2796.png"
    />
    <!-- iPhone 16 Pro, 17, 17 Pro. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-1206x2622.png"
    />
    <!-- iPhone Air. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-1260x2736.png"
    />
    <!-- iPhone 16 Pro Max, 17 Pro Max. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-1320x2868.png"
    />
    <!-- Default tab title; each page replaces it with its own. -->
    <title>CoNote</title>
    <!-- The launch splash's styles (D61). Inline, so the splash paints before any file loads;
         the CSP allows inline styles. Colours are the brand tokens (tokens.css isn't loaded yet). -->
    <style>
      /* Full screen, brand colour, content centred; above everything while the app starts. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        /* Clear of the notch and home indicator. */
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
        background: #4f46e5;
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
        /* The fade when the app is ready (splash.ts sets data-state). */
        transition: opacity 250ms ease;
      }
      /* Fading out: invisible, and ignores taps while it goes. */
      #splash[data-state='hiding'] {
        opacity: 0;
        pointer-events: none;
      }
      /* The app name. */
      #splash .splash-name {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      /* The tagline. */
      #splash .splash-tagline {
        margin: 0;
        font-size: 15px;
        opacity: 0.9;
      }
      /* Three dots near the bottom that pulse in turn while loading. */
      #splash .splash-dots {
        position: absolute;
        bottom: calc(48px + env(safe-area-inset-bottom));
        display: flex;
        gap: 8px;
      }
      #splash .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.35;
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      #splash .splash-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      #splash .splash-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes splash-pulse {
        50% {
          opacity: 1;
        }
      }
      /* Reduced motion (NFR-2): no pulse, no fade. */
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
        #splash .splash-dots span {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <!-- The launch splash (D61): shown before any script runs, removed by the app once the first
         page is ready (src/features/pwa/splash.ts). role="status" with a label tells screen
         readers the app is loading; the visible text inside is hidden from them to avoid repeats. -->
    <div id="splash" role="status" aria-label="Loading CoNote">
      <!-- The logo mark, reversed out of the brand colour: a white tile with the indigo C. -->
      <svg aria-hidden="true" width="80" height="80" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="8" fill="#fff" />
        <path
          d="M20.5 11.2a6.5 6.5 0 1 0 0 9.6"
          fill="none"
          stroke="#4f46e5"
          stroke-width="3"
          stroke-linecap="round"
        />
        <circle cx="22" cy="16" r="2" fill="#4f46e5" />
      </svg>
      <!-- Name and tagline. -->
      <p class="splash-name" aria-hidden="true">CoNote</p>
      <p class="splash-tagline" aria-hidden="true">Your notes. Collective understanding.</p>
      <!-- Loading dots; decorative. -->
      <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <!-- Without JavaScript the app can't run; say so instead of leaving the splash up. -->
    <noscript>
      <style>
        #splash {
          display: none;
        }
      </style>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        CoNote needs JavaScript. Turn it on in your browser settings, then reload.
      </p>
    </noscript>
    <!-- React mounts the app here (src/main.tsx). -->
    <div id="root"></div>
    <!-- The app's entry point. type="module" loads it as an ES module; it runs after parsing. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
